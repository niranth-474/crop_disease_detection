services:
  - type: web
    name: crop-disease-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MODEL_PATH
        value: /app/saved_models/best_model.pth
      - key: CLASS_NAMES_PATH
        value: /app/PlantVillage/class_names.json
      - key: ALLOWED_ORIGINS
        value: https://crop-disease-frontend.onrender.com

  - type: web
    name: crop-disease-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://crop-disease-backend.onrender.com/api
