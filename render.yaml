services:
  - type: web_service
    name: crop-disease-backend
    env: docker
    plan: free
    branch: main
    dockerfilePath: backend/Dockerfile
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MODEL_PATH
        value: /app/saved_models/best_model.pth
      - key: CLASS_NAMES_PATH
        value: /app/PlantVillage/class_names.json
      - key: ALLOWED_ORIGINS
        value: https://crop-disease-frontend.onrender.com

  - type: static_site
    name: crop-disease-frontend
    env: node
    plan: free
    branch: main
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://crop-disease-backend.onrender.com/api
